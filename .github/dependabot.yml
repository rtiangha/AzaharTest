version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore (actions)"

  # Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/src/android/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore (deps)"

